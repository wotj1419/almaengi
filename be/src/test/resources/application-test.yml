spring:
  datasource:
    url: jdbc:h2:mem:chat-testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  # 테스트에서 schema.sql 강제 로딩 방지 (엔티티 기반 DDL만 사용)
  sql:
    init:
      mode: never
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret-key: test-secret-key-for-jwt-provider-should-be-long-enough-1234567890
  access-token-expiry: 86400000
  refresh-token-expiry: 604800000
